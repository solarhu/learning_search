version: '3.8'

services:
  learning-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-search
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=${PORT:-8081}
    restart: unless-stopped
